<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>LUMINO — 照明ニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUMINO">
<meta name="theme-color" content="#070b16">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="lumino-bg">
    <div class="lumino-app" id="luminoApp">
      <div class="lumino-tint" id="luminoTint"></div>
      <div class="lumino-glow" id="luminoGlow"></div>

      <!-- TOP BAR -->
      <header class="lumino-topbar">
        <div class="lumino-brand">
          <img class="lumino-logo" src="icons/lumino-mark.svg" alt="" width="34" height="34">
          <div class="lumino-wordmark">LUMIN<span class="lumino-wordmark-o"></span></div>
        </div>
        <div class="lumino-topbar-sub">更新 <span id="fetchedAt">—</span></div>
      </header>

      <!-- CONTENT -->
      <main class="lumino-content">

        <!-- SECTION TITLE -->
        <div class="lumino-section-heading">
          <div class="lumino-section-label-row">
            <span class="lumino-section-dot" id="sectionDot"></span>
            <span class="lumino-section-label" id="sectionLabel"></span>
          </div>
          <h1 class="lumino-section-title" id="sectionTitle"></h1>
        </div>

        <!-- NEWS -->
        <section class="lumino-section" id="tab-news">
          <div class="lumino-news-controls">
            <div class="lumino-search">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7c859b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" class="lumino-search-icon"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
              <input type="text" id="searchInput" class="lumino-search-input" placeholder="記事を検索…">
              <button type="button" id="searchClearBtn" class="lumino-search-clear" aria-label="クリア" hidden>×</button>
            </div>
          </div>

          <div class="lumino-meta">
            <span><span class="lumino-meta-value" id="nArticles">0</span> 件</span>
            <span class="lumino-meta-sep"></span>
            <span><span id="nSources">0</span> ソース</span>
            <span class="lumino-meta-sep"></span>
            <span class="lumino-meta-today"><span class="lumino-dot-sm"></span>今日の新着 <span id="nToday">0</span> 件</span>
          </div>

          <div class="lumino-grid" id="newsGrid"></div>
          <div class="lumino-empty" id="emptyState" hidden>
            <div class="lumino-empty-title">該当する記事がありません</div>
            <div class="lumino-empty-sub">キーワードを変えてお試しください。</div>
            <button type="button" class="lumino-empty-reset" id="emptyResetBtn">検索をクリア</button>
          </div>
        </section>

      </main>

      <!-- BOTTOM NAV（Buto-do と同じフローティングのタブバー） -->
      <div class="lumino-tabbar-wrap">
        <div class="lumino-tabbar-fade"></div>
        <nav class="lumino-tabbar" id="bottomNav">
          <button class="lumino-tabitem" data-tab="Art">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16.6A4.4 4.4 0 0 0 21 10.8C21 6.5 17 3 12 3z"></path><circle cx="7.5" cy="11" r="1.1"></circle><circle cx="10.5" cy="7.2" r="1.1"></circle><circle cx="15.2" cy="7.6" r="1.1"></circle></svg>
            <span>Art</span>
          </button>
          <button class="lumino-tabitem" data-tab="Architecture">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V8l7-4 7 4v13"></path><path d="M9.5 21v-5h5v5"></path><path d="M9 11h.01M15 11h.01"></path></svg>
            <span>Architecture</span>
          </button>
          <button class="lumino-tabitem" data-tab="Technology">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"></path></svg>
            <span>Technology</span>
          </button>
        </nav>
      </div>

    </div>
  </div>
  <script src="data.js"></script>
  <script src="news.js"></script>
  <script src="app.js"></script>
</body>
</html>
